[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oi-discovery"
version = "0.1.0"
description = "Metadata-first scientific dataset discovery with explainable manifests"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "viniburilux"}]
license = {file = "LICENSE"}
dependencies = ["requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
oi-discover = "oi_discovery.cli:main"
